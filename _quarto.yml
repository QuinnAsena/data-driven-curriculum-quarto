project:
  type: book

book:
  title: "Palaeoecological data-science: a data driven curriculum"
  author: "Quinn Asena, Jack Williams, Simon Goring, Socorro Dominguez Vidana"
  date: today
  repo-url: https://github.com/QuinnAsena/data-driven-curriculum-quarto
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - 01-intro.qmd
#    - 02-intro-to-R.qmd
    - 03-neotoma2.qmd
    - 04-age-depth-modelling.qmd
    - 05-wrangling-visualisation.qmd
    - 06-dissimilarity.qmd
    - 07-no-analogue.qmd
    - 08-rate-of-change.qmd
    - 09-ordination-pca.qmd
    - 10-ordination-nmds.qmd
    - 11-gams.qmd
    - references.qmd

bibliography: data-driven-curriculum.bib
from: markdown+emoji

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-link: true
    link-external-newwindow: true
    link-external-icon: true
    embed-resources: false # must be specified as false otherwise html file size accumulate until too large!

execute:
  # freeze, not cache. Frozen results are committed to _freeze/ so the GitHub Action can
  # render without an R toolchain, without compiling rioja, and without calling the Neotoma
  # API. Re-render locally and commit _freeze/ whenever a code chunk changes.
  freeze: auto
