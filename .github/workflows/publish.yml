name: Render and publish book

# Publishes on a push or merge to master, and nothing else. `workflow_dispatch`
# lets you re-run it by hand from the Actions tab without pushing anything.
on:
  push:
    branches: [master]
  workflow_dispatch:

# The built site is handed straight to GitHub Pages as an upload, so nothing is
# ever pushed back into the repository and the token needs only read access.
# This requires Settings -> Pages -> Source to be set to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A second push while the first is still deploying
# waits rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R setup step on purpose. `execute: freeze: auto` in _quarto.yml means the
      # committed _freeze/ directory supplies every computed result, so this job needs
      # neither an R toolchain, nor a rioja compile, nor any Neotoma API calls.
      #
      # The consequence: ANY edit to a .qmd invalidates that chapter's freeze, prose-only
      # edits included, because the hash covers the whole source file and not just the
      # chunks. Under `freeze: auto` a stale freeze makes the render step below fail hard
      # with "Unable to locate an installed version of R"; it does NOT silently publish
      # stale output, which is only what `freeze: true` would do. So re-render locally and
      # commit _freeze/ in the same commit as the source.
      #
      # The freeze hash is the md5 of the source file with line endings normalised to LF,
      # so a CRLF working tree on Windows still matches on this Linux checkout.
      - name: Confirm frozen results are present
        run: |
          if [ ! -d "_freeze" ]; then
            echo "::error::_freeze/ is missing. Render locally and commit it, or this build will produce a book with no computed output."
            exit 1
          fi
          count=$(find _freeze -name "*.json" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::_freeze/ exists but holds no frozen results. Re-render locally and commit _freeze/."
            exit 1
          fi
          echo "_freeze/ present with $count frozen result files."

      # Render and deploy are deliberately separate steps. Fused together inside
      # `quarto publish`, a render failure and a publishing failure look identical in the
      # log, which is exactly what made the 2026-09-08 breakage hard to read.
      - name: Render the book
        run: quarto render

      - name: Upload the rendered book to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
